# Checks in a reservation as a new major version.
mutation CheckinDocument($repositoryIdentifier: String!, $identifier: String!) {
  checkinDocument(
    repositoryIdentifier: $repositoryIdentifier
    identifier: $identifier
    checkinAction: { checkinMinorVersion: false }
  ) {
    id
    name
    majorVersionNumber
    minorVersionNumber
    isCurrentVersion
  }
}
