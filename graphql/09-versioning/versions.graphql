# Lists all versions of the version series of a document.
query Versions($repositoryIdentifier: String!, $identifier: String!) {
  document(repositoryIdentifier: $repositoryIdentifier, identifier: $identifier) {
    id
    versionSeries {
      versions {
        versionables {
          id
          majorVersionNumber
          minorVersionNumber
          versionStatus
        }
      }
    }
  }
}
