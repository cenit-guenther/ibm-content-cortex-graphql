# Checks out a document. The response describes the released version; the working copy
# (reservation) is returned in the field "reservation". Check in or cancel using its id.
mutation CheckoutDocument($repositoryIdentifier: String!, $identifier: String!) {
  checkoutDocument(repositoryIdentifier: $repositoryIdentifier, identifier: $identifier) {
    id
    name
    isReserved
    reservation {
      id
      minorVersionNumber
    }
  }
}
