# Creates a document with one content element and files it into a folder.
# FileNet has no Upload scalar: the content variable is declared as String and is
# replaced by the file part of a multipart request, see docs/examples/06-upload.adoc.
mutation CreateDocument(
  $repositoryIdentifier: String!
  $name: String!
  $folder: String!
  $contentType: String!
  $file: String
) {
  createDocument(
    repositoryIdentifier: $repositoryIdentifier
    documentProperties: {
      name: $name
      contentElements: {
        replace: [
          {
            type: CONTENT_TRANSFER
            contentType: $contentType
            subContentTransfer: { content: $file, retrievalName: $name }
          }
        ]
      }
    }
    fileInFolderIdentifier: $folder
    checkinAction: {}
  ) {
    id
    name
    mimeType
    contentSize
  }
}
