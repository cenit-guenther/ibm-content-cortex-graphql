# Reads the access control list (permissions) of a document.
query Permissions($repositoryIdentifier: String!, $identifier: String!) {
  document(repositoryIdentifier: $repositoryIdentifier, identifier: $identifier) {
    id
    name
    permissions {
      className
      ... on Permission {
        granteeName
        granteeType
        permissionSource
      }
      ... on AccessPermission {
        accessType
        accessMask
        inheritableDepth
      }
    }
  }
}
